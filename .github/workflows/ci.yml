
name: CRUD Backend CI

on:
  push:
    branches: [devops-crud]
  pull_request:
    branches: [devops-crud]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start API server
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!

          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/students > /dev/null; then
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              exit 1
            fi

            sleep 1
          done

          if ! curl --fail --silent --show-error http://127.0.0.1:3000/students > /dev/null; then
            cat server.log
            exit 1
          fi

          npm test
