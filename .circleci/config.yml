
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:22.0

    steps:
      - checkout
      - run: npm install

      - run:
          name: Start server and test
          command: |
            npm start > server.log 2>&1 &
            sleep 5
            npm test

workflows:
  build:
    jobs:
      - test
